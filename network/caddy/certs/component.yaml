# yaml-language-server: $schema=../../../platform/lab/schema/lab.schema.json
name: certs
kind: certificate
partOf: proxy
workflow: caddy-certificates
description: "The wildcard certificate, issued and renewed by lego over a DNS challenge."
domains: ["*.twolfe.dev"]
issuer:
  image: goacme/lego:v5.4.0
  email: tom@twolfe.dev
  dns: netlify
  store: ~/Docker/caddy/lego
  environment:
    NETLIFY_TOKEN: op://Wolfe.Lab/netlify-pat/credential
  propagationWait: 90s
