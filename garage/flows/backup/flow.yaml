id: backup
namespace: lab.garage
description: Nightly cold backup of garage's meta/ and data/
labels:
  job: backup
  alert: high

concurrency:
  limit: 1
  behavior: QUEUE

tasks:
  - id: backup
    type: io.kestra.plugin.fs.ssh.Command
    timeout: PT15M
    commands:
      - garage/backup

triggers:
  - id: nightly
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "50 2 * * *"
    timezone: Europe/London
