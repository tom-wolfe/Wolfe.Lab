# Single-node Garage on the Mac mini.
# Secrets (rpc_secret, admin token) come from environment variables
# (GARAGE_RPC_SECRET / GARAGE_ADMIN_TOKEN) via the env file — never here.

metadata_dir = "/var/lib/garage/meta"
data_dir = "/var/lib/garage/data"
db_engine = "lmdb"

# One node, one copy. Garage is built for multi-node replication —
# raise this if the lab ever grows a second storage box.
replication_factor = 1

rpc_bind_addr = "[::]:3901"
rpc_public_addr = "127.0.0.1:3901"

[s3_api]
s3_region = "garage"
api_bind_addr = "[::]:3900"
root_domain = ".s3.macmini.local"

[admin]
api_bind_addr = "[::]:3903"
