name: garage

services:
  garage:
    # Pinned. Bump deliberately — check the changelog for metadata format
    # migrations before jumping versions.
    image: dxflrs/garage:v2.4.1
    container_name: garage
    restart: unless-stopped

    environment:
      GARAGE_RPC_SECRET:
      GARAGE_ADMIN_TOKEN:

    volumes:
      # Config is code — lives in this repo, mounted read-only.
      - ./garage.toml:/etc/garage.toml:ro
      # State is data — lives outside it, like every other stack.
      - /Users/tomwolfe/Docker/garage/meta:/var/lib/garage/meta
      - /Users/tomwolfe/Docker/garage/data:/var/lib/garage/data

    ports:
      - "3900:3900" # S3 API
      - "3903:3903" # Admin API

    networks:
      - lab

    healthcheck:
      # EXEC form only — this image has no shell at all, so the CMD-SHELL
      # form (and any `sh -c` wrapper) fails with "executable file not
      # found". `/garage status` talks to the running node over RPC using
      # the config it already has, and exits non-zero if the node is not
      # answering.
      test: ["CMD", "/garage", "status"]
      interval: 30s
      timeout: 10s
      start_period: 20s
      retries: 5

networks:
  # The shared edge network — owned and created by the caddy slice, which
  # must be deployed once before this stack. See caddy/README.md.
  lab:
    external: true
