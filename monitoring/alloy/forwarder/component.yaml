# yaml-language-server: $schema=../../../platform/lab/schema/lab.schema.json
name: forwarder
kind: collector
workflow: agent
description: "Telemetry collector on each node."
runsOn: all
agent: alloy
package:
  github: grafana/alloy
  version: 1.20.1
  asset: "alloy-{platform}.zip"
  checksums: SHA256SUMS
program: "{package}/alloy-{platform}"
arguments: [run, "{lab.root}/alloy-forwarder/config/forwarder.alloy", "--storage.path={state}", --server.http.listen-addr=127.0.0.1:12345, --disable-reporting]
environment:
  LAB_GATEWAY: "{node.mini.address}"
  DOCKER_HOST: "{node.docker}"
supersedes: [homebrew.mxcl.grafana-alloy]
