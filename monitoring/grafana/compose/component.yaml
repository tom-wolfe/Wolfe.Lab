# yaml-language-server: $schema=../../../platform/lab/schema/lab.schema.json
name: loki
kind: database
workflow: docker
service: loki
displayName: Loki
description: "The log store."
metrics:
  port: 3100
---
name: prometheus
kind: database
workflow: docker
service: prometheus
displayName: Prometheus
description: "The metrics store."
metrics:
  port: 9090
---
name: tempo
kind: database
workflow: docker
service: tempo
displayName: Tempo
description: "The trace store."
metrics:
  port: 3200
---
name: server
kind: app
workflow: docker
service: grafana
displayName: Grafana
description: "Grafana, in front of the three stores."
dependsOn: [loki, prometheus, tempo]
# Forgejo has the mini's 3000.
metrics:
  port: 3000
  published: 13000
