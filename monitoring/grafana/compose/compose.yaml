name: grafana

services:
  grafana:
    image: grafana/grafana:13.2.3
    container_name: grafana
    restart: unless-stopped
    environment:
      TZ: Europe/London
      GF_SERVER_ROOT_URL: https://grafana.twolfe.dev
      # The admin login is set only when the database is first created; a
      # rotated password reaches Grafana through `grafana cli admin
      # reset-admin-password`, not a redeploy (RUNBOOK.md).
      GF_SECURITY_ADMIN_USER:
      GF_SECURITY_ADMIN_PASSWORD:
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_PLUGINS_PREINSTALL_SYNC: grafana-llm-app@1.1.0
      PUSHOVER_APP_TOKEN:
      PUSHOVER_USER_KEY:
      HEALTHCHECKS_PING_KEY:
    volumes:
      - ./config/grafana/provisioning:/etc/grafana/provisioning:ro
      - ${HOME}/Docker/grafana/grafana:/var/lib/grafana
    networks:
      - lab
      - telemetry
    depends_on:
      - prometheus
      - loki
      - tempo
    deploy:
      resources:
        limits:
          memory: 768m
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 30s

  loki:
    image: grafana/loki:3.7.8
    container_name: loki
    restart: unless-stopped
    command: ["-config.file=/etc/loki/loki.yaml"]
    volumes:
      - ./config/loki:/etc/loki:ro
      - ${HOME}/Docker/grafana/loki:/loki
    networks:
      - telemetry
    deploy:
      resources:
        limits:
          memory: 512m
    # The images are distroless — no shell, no wget — but the binaries
    # carry their own client for /ready. 127.0.0.1, not the default
    # localhost, which resolves to ::1 first (beszel's compose.yaml).
    healthcheck:
      test: ["CMD", "/usr/bin/loki", "-health", "-health.url=http://127.0.0.1:3100/ready"]
      interval: 60s
      timeout: 5s
      retries: 3
      # The ingester reports ready 15s after joining its ring.
      start_period: 30s

  tempo:
    image: grafana/tempo:3.1.0
    container_name: tempo
    restart: unless-stopped
    command: ["-config.file=/etc/tempo/tempo.yaml"]
    volumes:
      - ./config/tempo:/etc/tempo:ro
      - ${HOME}/Docker/grafana/tempo:/var/tempo
    networks:
      - telemetry
    deploy:
      resources:
        limits:
          memory: 512m
    healthcheck:
      test: ["CMD", "/tempo", "-health", "-health.url=http://127.0.0.1:3200/ready"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 30s

  prometheus:
    image: prom/prometheus:v3.15.0
    container_name: prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
      - --storage.tsdb.retention.size=5GB
      - --web.enable-remote-write-receiver
      - --web.enable-otlp-receiver
    volumes:
      - ./config/prometheus:/etc/prometheus:ro
      - ${HOME}/Docker/grafana/prometheus:/prometheus
    networks:
      - telemetry
    deploy:
      resources:
        limits:
          memory: 1g
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9090/-/ready"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 30s

networks:
  lab:
    external: true
  # Named, so the gateway's stack (../gateway) can join it.
  telemetry:
    name: grafana_telemetry
