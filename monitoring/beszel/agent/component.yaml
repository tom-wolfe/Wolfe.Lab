# yaml-language-server: $schema=../../../platform/lab/schema/lab.schema.json
name: agent
kind: collector
workflow: agent
description: "The monitoring agent that runs on each node."
runsOn: all
agent: beszel-agent
package:
  github: henrygd/beszel
  version: 0.21.0
  asset: "beszel-agent_{platform.os}_{platform.arch}.tar.gz"
  checksums: "beszel_{version}_checksums.txt"
program: "{package}/beszel-agent"
environment:
  TOKEN: op://Wolfe.Lab/beszel-agent/credential
  KEY: op://Wolfe.Lab/beszel-agent/username
  LISTEN: 127.0.0.1:45876
  HUB_URL: "http://{node.mini.address}:8090"
  EXTRA_FILESYSTEMS: "{node.drives}"
  DOCKER_HOST: "{node.docker}"
# The Macs' Homebrew services and the Pi's hand-written units it replaced; each node retires
# whichever it has.
supersedes: [sh.brew.beszel-agent, homebrew.mxcl.beszel-agent, beszel-agent.service, beszel-agent.path]
