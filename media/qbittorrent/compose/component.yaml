# yaml-language-server: $schema=../../../platform/lab/schema/lab.schema.json
name: vpn
kind: network
workflow: docker
service: gluetun
displayName: gluetun
description: "VPN tunnel for the download client."
---
name: client
kind: app
workflow: docker
service: qbittorrent
requiresVolumes: [/Volumes/Data1, /Volumes/Data2]
description: "Client for handling larger downloads that need supervising."
dependsOn: [vpn]
