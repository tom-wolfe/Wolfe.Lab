id: plan
namespace: lab.restic
description: Daily drift report for the restic Tofu stack.

labels:
  job: plan
  alert: low

concurrency:
  limit: 1
  behavior: QUEUE

tasks:
  - id: plan
    type: io.kestra.plugin.fs.ssh.Command
    allowFailure: true
    timeout: PT10M
    commands:
      - restic/plan
  - id: gate
    type: io.kestra.plugin.core.execution.Fail
    condition: "{{ outputs.plan.exitCode == 1 }}"
    errorMessage: Plan could not run — an outage, not drift.

triggers:
  - id: daily
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "40 7 * * *"
    timezone: Europe/London