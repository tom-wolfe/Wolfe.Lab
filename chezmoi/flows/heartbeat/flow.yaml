id: heartbeat
namespace: lab.chezmoi
description: |
  The dead man's switch: ping healthchecks.io every 15 minutes, on Kestra's
  own schedule. healthchecks.io alerts when the pings STOP — the only way
  "the lab is off" (Kestra down, postgres wedged, mini unplugged) ever
  reaches a phone, because every other alert path in this lab is itself a
  Kestra flow and dies with Kestra. What a ping proves is exactly "Kestra
  is alive and its scheduler fires", which is what the backups and the
  health probes depend on; CD proves itself elsewhere (Actions).

  Deliberately NOT allowFailed: a 404 SHOULD go red. It means the ping key
  or the slug is wrong, and this flow failing is a safe, alertable signal.

  The check itself — schedule, grace, notification channels — is declared in
  chezmoi/tofu/checks.tf, on the same cron as this trigger so a missed slot
  is caught at that slot. Pinged by slug: `lab-chezmoi-update` is the
  check's slug (its name from when the CD tick was the pulse; renaming the
  check would recreate it, so the slug stays).
labels:
  job: heartbeat
  # High: the whole point of this flow is noticing silence. If it is failing,
  # healthchecks.io will report the lab as down and you want to know it was
  # the pinger.
  alert: high
concurrency:
  limit: 1
  behavior: QUEUE
tasks:
  - id: ping
    type: io.kestra.plugin.core.http.Request
    # One HTTP call. If it can't finish in a minute the endpoint is gone,
    # which is exactly what this flow should go red about.
    timeout: PT1M
    uri: "https://hc-ping.com/{{ secret('HEALTHCHECKS_PING_KEY') }}/lab-chezmoi-update"
    method: GET
triggers:
  - id: quarter-hourly
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/15 * * * *"
    timezone: Europe/London
