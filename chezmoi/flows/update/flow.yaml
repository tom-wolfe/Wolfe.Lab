id: update
namespace: lab.chezmoi
description: Runs chezmoi update, which pulls the repo, and applies the changes.

labels:
  job: tick
  alert: low

concurrency:
  limit: 1
  behavior: QUEUE

tasks:
  - id: converge
    type: io.kestra.plugin.fs.ssh.Command
    timeout: PT10M
    commands:
      - chezmoi/update

triggers:
  - id: after-tick
    type: io.kestra.plugin.core.trigger.Flow
    preconditions:
      id: tick-fired
      flows:
        - namespace: lab.kestra
          flowId: tick
          states: [SUCCESS]
