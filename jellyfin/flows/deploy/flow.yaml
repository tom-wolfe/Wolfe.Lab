id: deploy-jellyfin
namespace: lab
description: |
  Converge the jellyfin compose stack from the repo checkout. Chains on
  every green chezmoi-update tick (the tick is what pulls the repo); between
  changes each run is a no-op thanks to compose's config-hash convergence.
  Host side: jellyfin/flows/deploy/script.sh via the lab-job bridge.

concurrency:
  limit: 1
  behavior: QUEUE

tasks:
  - id: converge
    type: io.kestra.plugin.fs.ssh.Command
    host: host.docker.internal
    port: "22"
    username: tomwolfe
    authMethod: PUBLIC_KEY
    privateKey: "{{ secret('LAB_SSH_KEY') }}"
    commands:
      - jellyfin/deploy

triggers:
  # See forgejo/flows/deploy/flow.yaml for the design notes.
  - id: after-tick
    type: io.kestra.plugin.core.trigger.Flow
    preconditions:
      id: chezmoi-tick-green
      flows:
        - namespace: lab
          flowId: chezmoi-update
          states: [SUCCESS]
