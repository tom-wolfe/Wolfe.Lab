# shellcheck shell=bash disable=SC2034
state="$HOME/Library/Application Support"
paths=("$state/jellyfin")

# What's kept is the part you can't re-fetch: config, database, library
# roots, plugins. restic prunes excluded directories — nested contents
# never get visited.
excludes=(
  --exclude "$state/jellyfin/cache"
  --exclude "$state/jellyfin/log"
  --exclude "$state/jellyfin/transcodes"
  # Dead since the 10.10 -> 10.11 migration; 10.11 reads jellyfin.db only.
  --exclude "$state/jellyfin/data/library.db.old"
  --exclude "$state/jellyfin/data/library.db-wal"
  --exclude "$state/jellyfin/data/library.db-shm"
)

# metadata/ is ~670 MB of TMDB artwork that a "Refresh Metadata"
# re-downloads — skipped unless asked for.
if [ "${1:-}" != "--with-metadata" ]; then
  excludes+=(--exclude "$state/jellyfin/metadata")
fi
