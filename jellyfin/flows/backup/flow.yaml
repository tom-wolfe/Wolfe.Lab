id: backup
namespace: lab.jellyfin
description: Nightly cold backup of jellyfin's state.
labels:
  job: backup
  alert: high

concurrency:
  limit: 1
  behavior: QUEUE

tasks:
  - id: backup
    type: io.kestra.plugin.fs.ssh.Command
    timeout: PT15M
    commands:
      - jellyfin/backup

triggers:
  - id: nightly
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "35 3 * * *"
    timezone: Europe/London
