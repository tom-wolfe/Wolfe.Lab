id: backup
namespace: lab.beszel
description: Nightly cold backup of the hub's SQLite database.
labels:
  job: backup
  # High: a backup is silent until the day you need it. Nothing downstream
  # notices a missing archive, so the alert IS the safety net.
  alert: high

concurrency:
  limit: 1
  behavior: QUEUE

tasks:
  - id: backup
    type: io.kestra.plugin.fs.ssh.Command
    timeout: PT15M
    commands:
      - beszel/backup

triggers:
  - id: nightly
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "35 2 * * *"
    timezone: Europe/London
