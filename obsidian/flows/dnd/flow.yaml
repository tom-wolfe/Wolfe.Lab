id: dnd
namespace: lab.obsidian
description: |
  One-shot sync of the Dungeons & Dragons Obsidian vault from Google Drive.
  See lab.obsidian/main for the design; this is its twin, offset by five
  minutes so the two passes never contend for Drive at the same moment.

labels:
  job: sync
  alert: low

concurrency:
  limit: 1
  behavior: QUEUE

tasks:
  - id: sync
    type: io.kestra.plugin.fs.ssh.Command
    # Must stay under the 10-minute schedule: with concurrency QUEUE, a
    # pass that outlives its interval stacks the next one behind it.
    timeout: PT8M
    host: host.docker.internal
    port: "22"
    username: tomwolfe
    authMethod: PUBLIC_KEY
    privateKey: "{{ secret('LAB_SSH_KEY') }}"
    commands:
      - obsidian/dnd

triggers:
  - id: every-10-min-offset
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "5-59/10 * * * *"
    timezone: Europe/London
