name: restic offsite

on:
  schedule:
    - cron: "35 4 * * *"
  workflow_dispatch:

concurrency:
  group: MacMini
  cancel-in-progress: false

jobs:
  offsite:
    runs-on: MacMini
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - working-directory: restic/repositories
        run: lab offsite
