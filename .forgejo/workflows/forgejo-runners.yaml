name: forgejo runners

on:
  workflow_dispatch:
    inputs:
      node:
        description: "The node whose runner to register: MacMini, wolfe-pi5"
        required: true
        type: string
      kind:
        description: "Which runner"
        required: true
        type: choice
        options: [host, docker]
        default: host

concurrency:
  group: MacMini
  cancel-in-progress: false

jobs:
  register:
    runs-on: MacMini
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - working-directory: forgejo/runners
        run: lab register --node "${{ inputs.node }}" --kind "${{ inputs.kind }}" --auto-approve
