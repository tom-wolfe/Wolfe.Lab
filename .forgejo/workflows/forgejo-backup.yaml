name: forgejo backup

on:
  schedule:
    - cron: "25 2 * * *"
  workflow_dispatch:

concurrency:
  group: MacMini
  cancel-in-progress: false

jobs:
  backup:
    runs-on: MacMini
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - working-directory: forgejo/backup
        run: lab backup

  # The snapshot just taken, restored to scratch and asserted.
  restore-drill:
    needs: backup
    runs-on: MacMini
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - working-directory: forgejo/backup
        run: lab restore-drill
