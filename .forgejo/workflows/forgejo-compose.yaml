name: forgejo compose

on:
  pull_request:
  push:
    branches: [main]
    paths: [forgejo/compose/**, .forgejo/workflows/forgejo-compose.yaml]
  workflow_dispatch:

jobs:
  check:
    # Pre-merge code never runs on a node.
    if: github.event_name == 'pull_request'
    runs-on: docker
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - working-directory: forgejo/compose
        run: lab check

  deploy:
    if: github.event_name != 'pull_request'
    runs-on: MacMini
    timeout-minutes: 20
    concurrency:
      group: MacMini
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - working-directory: forgejo/compose
        run: lab deploy --auto-approve
