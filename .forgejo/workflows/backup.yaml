name: backup

on:
  schedule:
    - cron: "20 2 * * *"
  workflow_dispatch:

concurrency:
  group: MacMini
  cancel-in-progress: false

jobs:
  backup:
    strategy:
      matrix:
        slice:
          - beszel
          - forgejo
          - garage
          - jellyfin
          - qbittorrent
          - radarr
          - sonarr
          - immich
          - files
    runs-on: MacMini
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - working-directory: ${{ matrix.slice }}
        run: dotnet run --project ../build/src/Wolfe.Lab.Build -- backup
