name: backup

on:
  schedule:
    - cron: "20 2 * * *"
  workflow_dispatch:

concurrency:
  group: MacMini
  cancel-in-progress: false

jobs:
  backup:
    strategy:
      matrix:
        slice: 
          - qbittorrent
          - beszel
          - garage
          - forgejo
          - jellyfin
          - sonarr
          - radarr
    runs-on: MacMini
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: scripts/backup.sh ${{ matrix.slice }}

      - if: failure()
        run: |
          scripts/alert.sh "backup ${{ matrix.slice }} failed"

  # Its own job for its own timeout: a warm snapshot needs no stop window,
  # but the first pass reads the whole library.
  immich:
    runs-on: MacMini
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - run: scripts/backup.sh immich

      - if: failure()
        run: |
          scripts/alert.sh "backup immich failed"
