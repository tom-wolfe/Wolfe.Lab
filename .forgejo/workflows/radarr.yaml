name: radarr

on:
  push:
    branches: [main]
    paths: [radarr/**, scripts/deploy.sh, .forgejo/workflows/radarr.yaml]
  workflow_dispatch:

concurrency:
  group: MacMini
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: MacMini
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: scripts/deploy.sh radarr /Volumes/Data1 /Volumes/Data2

      - if: failure()
        run: |
          scripts/alert.sh "deploy radarr failed on MacMini"
