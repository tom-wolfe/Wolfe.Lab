name: caddy certs

on:
  schedule:
    - cron: "50 3 * * *"
  workflow_dispatch:

concurrency:
  group: MacMini
  cancel-in-progress: false

jobs:
  renew-certs:
    runs-on: MacMini
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - working-directory: caddy/certs
        run: lab renew --auto-approve
