name: gatus health

on:
  schedule:
    - cron: "11-59/15 * * * *"
  workflow_dispatch:

jobs:
  probe:
    runs-on: MacMini
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - working-directory: gatus/health
        run: dotnet run --project ../../build/src/Wolfe.Lab.Build -- probe
