name: obsidian dnd

# Daily: the vault changes on game nights, so a day is one commit per
# session. Off the :00 column so it never coincides with main's pass.
on:
  schedule:
    - cron: "5 5 * * *"
  workflow_dispatch:

concurrency:
  group: obsidian-dnd
  cancel-in-progress: false

jobs:
  sync:
    runs-on: MacMini
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - working-directory: obsidian
        run: dotnet run --project ../build/src/Wolfe.Lab.Build -- sync --vault dnd --auto-approve
