# Review-quality checks on every pull request and on main, on the
# containerized runner: pre-merge code never runs on a node.
name: ci

on:
  pull_request:
  push:
    branches: [main]

# A newer push to the same branch supersedes the running check.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: docker
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install linters
        run: |
          apt-get update -q
          apt-get install -y -q --no-install-recommends shellcheck python3-yaml >/dev/null

      - name: Every chezmoi profile renders
        # The whole source, for each machine, with the vault stubbed — a
        # template that only breaks on one profile fails here, not on the
        # merge. The listing is the review aid: what each machine gets.
        run: |
          sh -c "$(curl -fsLS get.chezmoi.io)" -- -b /usr/local/bin >/dev/null
          for profile in macbook work-macbook macmini-node pi-node; do
            scripts/chezmoi-render.sh "$profile" "/tmp/render/$profile"
          done

      - name: Shell scripts
        # The repo's scripts, plus every profile's rendered chezmoi scripts
        # (templates in the source, so only their output is shell).
        run: |
          git ls-files '*.sh' | xargs -r shellcheck
          find /tmp/render -path '*/.chezmoiscripts/*' -type f | xargs -r shellcheck

      - name: YAML parses
        # .chezmoitemplates/ holds Go templates that only become YAML when
        # rendered (their names are the TARGET's), so they are not parsed here.
        run: |
          git ls-files '*.yaml' '*.yml' ':!chezmoi/home/.chezmoitemplates' | xargs -r python3 -c '
          import sys, yaml
          for f in sys.argv[1:]:
              with open(f) as fh:
                  yaml.safe_load(fh)
          '
