name: tailscale tofu

on:
  pull_request:
  push:
    branches: [main]
    paths: [tailscale/tofu/**, .forgejo/workflows/tailscale-tofu.yaml]
  workflow_dispatch:

jobs:
  check:
    if: github.event_name == 'pull_request'
    runs-on: MacMini
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - working-directory: tailscale/tofu
        run: lab check

  deploy:
    if: github.event_name != 'pull_request'
    runs-on: MacMini
    timeout-minutes: 30
    concurrency:
      group: MacMini
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - working-directory: tailscale/tofu
        run: lab deploy --auto-approve
