name: mail watcher

on:
  pull_request:
  push:
    branches: [main]
    paths: [mail/watcher/**, .forgejo/workflows/mail-watcher.yaml]
  workflow_dispatch:

jobs:
  check:
    # Pre-merge code never runs on a node.
    if: github.event_name == 'pull_request'
    runs-on: docker
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: build/global.json
      - working-directory: mail/watcher
        run: lab check

  deploy:
    if: github.event_name != 'pull_request'
    runs-on: MacMini
    timeout-minutes: 30
    concurrency:
      group: MacMini
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - working-directory: mail/watcher
        run: lab deploy --auto-approve
