name: mail watcher

on:
  pull_request:
    paths: [mail/watcher/**, .forgejo/workflows/mail-watcher.yaml]
  push:
    branches: [main]
    paths: [mail/watcher/**, .forgejo/workflows/mail-watcher.yaml]

concurrency:
  group: mail-watcher-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # Pre-merge code never runs on a node.
    runs-on: docker
    timeout-minutes: 20
    defaults:
      run:
        working-directory: mail/watcher
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: mail/watcher/global.json
      - run: dotnet tool restore
      - run: dotnet ritten check
