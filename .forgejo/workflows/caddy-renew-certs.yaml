name: caddy renew-certs

on:
  schedule:
    - cron: "50 3 * * *"
  workflow_dispatch:

concurrency:
  group: MacMini
  cancel-in-progress: false

jobs:
  renew-certs:
    runs-on: MacMini
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - working-directory: caddy
        run: dotnet run --project ../build/src/Wolfe.Lab.Build -- renew-certs --auto-approve
