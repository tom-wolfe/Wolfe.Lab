name: garage

on:
  push:
    branches: [main]
    paths: [garage/**, scripts/deploy.sh, .forgejo/workflows/garage.yaml]
  workflow_dispatch:

concurrency:
  group: MacMini
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: MacMini
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: scripts/deploy.sh garage

      - if: failure()
        run: |
          scripts/alert.sh "deploy garage failed on MacMini" \
            "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_number }}"
