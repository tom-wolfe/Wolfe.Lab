name: renew certs

on:
  schedule:
    - cron: "50 3 * * *"
  workflow_dispatch:

concurrency:
  group: MacMini
  cancel-in-progress: false

jobs:
  renew:
    runs-on: MacMini
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: caddy/flows/renew-certs/script.sh

      - if: failure()
        run: |
          scripts/alert.sh "renew-certs failed" \
            "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_number }}"
