# The Pi's tick — its copy of lab.chezmoi/update, as a Forgejo Actions
# workflow instead of a Kestra flow (ROADMAP.md "CD moves to Forgejo
# Actions"). The runner on the node runs these steps in a shell on the node
# itself: no SSH bridge, no job dispatcher, no socket mounts.
#
# Every push to main and every quarter hour: pull the repo and converge
# machine config. Deploys for slices that live on the Pi will chain here as
# further jobs with `needs: update`.
name: tick wolfe-pi5

on:
  push:
    branches: [main]
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

concurrency:
  group: tick-wolfe-pi5
  cancel-in-progress: false

jobs:
  update:
    runs-on: wolfe-pi5
    timeout-minutes: 10
    steps:
      - name: Chezmoi update
        run: chezmoi update --init --no-tty

      - name: Report
        run: |
          echo "host:    $(hostname) ($(uname -m))"
          echo "repo:    $(git -C "$(chezmoi source-path)" rev-parse --short HEAD)"
          echo "docker:  $(docker version --format '{{.Server.Version}}')"
          echo "runner:  $(forgejo-runner --version)"

      - name: Alert on failure
        if: failure()
        run: |
          curl -fsS -o /dev/null https://api.pushover.net/1/messages.json \
            --form-string "token=$(op read 'op://Wolfe.Lab/pushover/credential')" \
            --form-string "user=$(op read 'op://Wolfe.Lab/pushover/username')" \
            --form-string "title=tick wolfe-pi5 failed" \
            --form-string "message=${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_number }}" \
            --form-string "priority=-1"
