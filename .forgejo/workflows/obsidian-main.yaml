name: obsidian main

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

concurrency:
  group: obsidian-main
  cancel-in-progress: false

jobs:
  sync:
    runs-on: MacMini
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - working-directory: obsidian/vaults
        run: lab sync --vault main --auto-approve
