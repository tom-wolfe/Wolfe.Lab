name: immich

on:
  push:
    branches: [main]
    paths: [immich/**, .forgejo/workflows/immich.yaml]
  workflow_dispatch:

concurrency:
  group: MacMini
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: MacMini
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - working-directory: immich
        run: dotnet run --project ../build/src/Wolfe.Lab.Build -- deploy --auto-approve
