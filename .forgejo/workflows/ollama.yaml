name: ollama

on:
  pull_request:
  push:
    branches: [main]
    paths: [ai/ollama/mini/**, .forgejo/workflows/ollama.yaml]
  workflow_dispatch:
  schedule:
    - cron: "19 1 * * *"

jobs:
  check:
    if: github.event_name == 'pull_request'
    runs-on: docker
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - working-directory: ai/ollama/mini
        run: lab check

  deploy:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: MacMini
    timeout-minutes: 45
    concurrency:
      group: MacMini
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - working-directory: ai/ollama/mini
        run: lab deploy --auto-approve

  rotate:
    if: github.event_name == 'schedule'
    runs-on: MacMini
    timeout-minutes: 10
    concurrency:
      group: MacMini
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - working-directory: ai/ollama/mini
        run: lab rotate --auto-approve
