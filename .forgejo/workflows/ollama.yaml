name: ollama

on:
  push:
    branches: [main]
    paths: [ollama/**, .forgejo/workflows/ollama.yaml]
  workflow_dispatch:

concurrency:
  group: MacMini
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: MacMini
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - working-directory: ollama/server
        run: lab deploy --auto-approve
