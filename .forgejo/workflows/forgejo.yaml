name: forgejo

on:
  push:
    branches: [main]
    paths: [forgejo/**, scripts/deploy.sh, .forgejo/workflows/forgejo.yaml]
  workflow_dispatch:

concurrency:
  group: MacMini
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: MacMini
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: scripts/deploy.sh forgejo

      - if: failure()
        run: |
          scripts/alert.sh "deploy forgejo failed on MacMini"
