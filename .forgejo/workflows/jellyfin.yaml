name: jellyfin

on:
  push:
    branches: [main]
    paths: [jellyfin/**, .forgejo/workflows/jellyfin.yaml]
  workflow_dispatch:

concurrency:
  group: MacMini
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: MacMini
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - working-directory: jellyfin
        run: dotnet run --project ../build/src/Wolfe.Lab.Build -- deploy --auto-approve
