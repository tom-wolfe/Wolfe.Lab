name: ollama studio

on:
  push:
    branches: [main]
    paths: [ollama/studio/**, .forgejo/workflows/ollama-studio.yaml]
  workflow_dispatch:

concurrency:
  group: MacStudio
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: MacStudio
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - working-directory: ollama/studio
        run: lab deploy --auto-approve
