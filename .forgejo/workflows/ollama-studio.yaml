name: ollama studio

on:
  pull_request:
  push:
    branches: [main]
    paths: [ollama/studio/**, .forgejo/workflows/ollama-studio.yaml]
  workflow_dispatch:

jobs:
  check:
    if: github.event_name == 'pull_request'
    runs-on: docker
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - working-directory: ollama/studio
        run: lab check

  deploy:
    if: github.event_name != 'pull_request'
    runs-on: MacStudio
    timeout-minutes: 60
    concurrency:
      group: MacStudio
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - working-directory: ollama/studio
        run: lab deploy --auto-approve
