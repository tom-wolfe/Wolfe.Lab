name: files backup

on:
  schedule:
    - cron: "30 3 * * *"
  workflow_dispatch:

concurrency:
  group: MacMini
  cancel-in-progress: false

jobs:
  backup:
    runs-on: MacMini
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7
      - working-directory: files/backup
        run: lab backup

  # The snapshot just taken, restored to scratch and asserted.
  restore-drill:
    needs: backup
    runs-on: MacMini
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - working-directory: files/backup
        run: lab restore-drill
