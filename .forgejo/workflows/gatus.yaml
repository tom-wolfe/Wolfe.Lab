name: gatus

on:
  push:
    branches: [main]
    paths: [gatus/**, scripts/deploy.sh, .forgejo/workflows/gatus.yaml]
  workflow_dispatch:

concurrency:
  group: wolfe-pi5
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: wolfe-pi5
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: scripts/deploy.sh gatus

      - if: failure()
        run: |
          scripts/alert.sh "deploy gatus failed on wolfe-pi5"
