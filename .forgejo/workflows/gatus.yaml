name: gatus

on:
  push:
    branches: [main]
    paths: [gatus/**, .forgejo/workflows/gatus.yaml]
  workflow_dispatch:

concurrency:
  group: wolfe-pi5
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: wolfe-pi5
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - working-directory: gatus
        run: dotnet run --project ../build/src/Wolfe.Lab.Build -- deploy --auto-approve
