name: tofu kestra

on:
  push:
    branches: [main]
    paths: [kestra/tofu/**, '*/flows/*/flow.yaml', scripts/apply.sh, scripts/plan.sh, .forgejo/workflows/tofu-kestra.yaml]
  schedule:
    - cron: "40 7 * * *"
  workflow_dispatch:

concurrency:
  group: MacMini
  cancel-in-progress: false

jobs:
  apply:
    if: github.event_name == 'push'
    runs-on: MacMini
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: scripts/apply.sh kestra

      - if: failure()
        run: |
          scripts/alert.sh "tofu apply kestra failed" \
            "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_number }}"

  plan:
    if: github.event_name != 'push'
    runs-on: MacMini
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - id: plan
        run: |
          set +e
          scripts/plan.sh kestra
          rc=$?
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          exit $rc

      - if: failure()
        run: |
          scripts/alert.sh "tofu kestra: ${{ steps.plan.outputs.rc == '2' && 'drift or pending change' || 'plan failed' }}" \
            "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_number }}"
