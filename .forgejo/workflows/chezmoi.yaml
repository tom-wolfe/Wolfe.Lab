name: chezmoi

on:
  pull_request:
  push:
    branches: [main]
    paths: [chezmoi/**, .forgejo/workflows/chezmoi.yaml]
  workflow_dispatch:

jobs:
  check:
    if: github.event_name == 'pull_request'
    runs-on: docker
    timeout-minutes: 15
    concurrency:
      group: chezmoi-check-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: build/global.json
      - working-directory: chezmoi
        run: dotnet run --project ../build/src/Wolfe.Lab.Build -- check

  deploy:
    if: github.event_name != 'pull_request'
    strategy:
      matrix:
        node: [MacMini, wolfe-pi5]
    runs-on: ${{ matrix.node }}
    concurrency:
      group: ${{ matrix.node }}
      cancel-in-progress: false
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - working-directory: chezmoi
        run: dotnet run --project ../build/src/Wolfe.Lab.Build -- deploy --auto-approve
