name: caddy

on:
  push:
    branches: [main]
    paths: [caddy/**, .forgejo/workflows/caddy.yaml, '*/caddy.caddyfile']
  workflow_dispatch:

concurrency:
  group: MacMini
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: MacMini
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - working-directory: caddy
        run: dotnet run --project ../build/src/Wolfe.Lab.Build -- deploy --auto-approve
