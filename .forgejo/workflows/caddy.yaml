name: caddy

on:
  push:
    branches: [main]
    paths: [caddy/**, scripts/deploy.sh, .forgejo/workflows/caddy.yaml, '*/caddy.caddyfile', caddy/flows/deploy/post.sh]
  workflow_dispatch:

concurrency:
  group: MacMini
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: MacMini
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: scripts/deploy.sh caddy

      - if: failure()
        run: |
          scripts/alert.sh "deploy caddy failed on MacMini" \
            "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_number }}"
