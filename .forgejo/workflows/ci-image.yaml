# The image every containerised job runs in: checked on the pull request,
# built and pushed to Forgejo's registry on the merge.
name: ci image

on:
  pull_request:
  push:
    branches: [main]
    paths: [ci/**, .forgejo/workflows/ci-image.yaml]
  workflow_dispatch:

jobs:
  check:
    if: github.event_name == 'pull_request'
    runs-on: docker
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - working-directory: ci/image
        run: lab check

  deploy:
    if: github.event_name != 'pull_request'
    runs-on: docker
    container:
      # The maintained fork of Google's archived kaniko; -debug for busybox's sh.
      image: ghcr.io/osscontainertools/kaniko:v1.28.5-debug
    timeout-minutes: 30
    concurrency:
      group: ci-image-deploy
      cancel-in-progress: false
    defaults:
      run:
        shell: sh
    steps:
      - env:
          REGISTRY_TOKEN: ${{ secrets.PACKAGES_TOKEN }}
        run: |
          set -eu
          auth="$(printf 'tom-wolfe:%s' "$REGISTRY_TOKEN" | base64 | tr -d '\n')"
          printf '{"auths":{"code.twolfe.dev":{"auth":"%s"}}}' "$auth" > /kaniko/.docker/config.json
          /kaniko/executor \
            --context "git://code.twolfe.dev/${{ github.repository }}.git#${{ github.ref }}#${{ github.sha }}" \
            --context-sub-path ci/image \
            --destination code.twolfe.dev/tom-wolfe/ci:latest
