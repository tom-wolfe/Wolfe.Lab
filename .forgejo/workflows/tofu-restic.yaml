name: tofu restic

on:
  push:
    branches: [main]
    paths: [restic/tofu/**, scripts/apply.sh, scripts/plan.sh, .forgejo/workflows/tofu-restic.yaml]
  schedule:
    - cron: "50 7 * * *"
  workflow_dispatch:

concurrency:
  group: MacMini
  cancel-in-progress: false

jobs:
  apply:
    if: github.event_name == 'push'
    runs-on: MacMini
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: scripts/apply.sh restic

      - if: failure()
        run: |
          scripts/alert.sh "tofu apply restic failed" \
            "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_number }}"

  plan:
    if: github.event_name != 'push'
    runs-on: MacMini
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - id: plan
        run: |
          set +e
          scripts/plan.sh restic
          rc=$?
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          exit $rc

      - if: failure()
        run: |
          scripts/alert.sh "tofu restic: ${{ steps.plan.outputs.rc == '2' && 'drift or pending change' || 'plan failed' }}" \
            "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_number }}"
