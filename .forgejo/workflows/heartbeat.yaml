# The dead man's switch: ping healthchecks.io every 15 minutes.
# No node group: it must never queue behind a long job.
name: heartbeat

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: MacMini
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - working-directory: heartbeat
        run: dotnet run --project ../build/src/Wolfe.Lab.Build -- ping
