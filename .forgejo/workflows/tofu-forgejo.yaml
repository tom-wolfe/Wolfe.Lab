name: tofu forgejo

on:
  push:
    branches: [main]
    paths: [forgejo/tofu/**, scripts/apply.sh, scripts/plan.sh, .forgejo/workflows/tofu-forgejo.yaml]
  schedule:
    - cron: "30 7 * * *"
  workflow_dispatch:

concurrency:
  group: MacMini
  cancel-in-progress: false

jobs:
  apply:
    if: github.event_name == 'push'
    runs-on: MacMini
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: scripts/apply.sh forgejo

      - if: failure()
        run: |
          scripts/alert.sh "tofu apply forgejo failed"

  plan:
    if: github.event_name != 'push'
    runs-on: MacMini
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - id: plan
        run: |
          set +e
          scripts/plan.sh forgejo
          rc=$?
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          exit $rc

      - if: failure()
        run: |
          scripts/alert.sh "tofu forgejo: ${{ steps.plan.outputs.rc == '2' && 'drift or pending change' || 'plan failed' }}"
