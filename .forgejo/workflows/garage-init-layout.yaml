name: garage init-layout

on:
  workflow_dispatch:

concurrency:
  group: MacMini
  cancel-in-progress: false

jobs:
  init-layout:
    runs-on: MacMini
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - working-directory: garage
        run: dotnet run --project ../build/src/Wolfe.Lab.Build -- init-layout --auto-approve
