name: sonarr

on:
  push:
    branches: [main]
    paths: [sonarr/**, scripts/deploy.sh, .forgejo/workflows/sonarr.yaml]
  workflow_dispatch:

concurrency:
  group: MacMini
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: MacMini
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: scripts/deploy.sh sonarr /Volumes/Data1 /Volumes/Data2

      - if: failure()
        run: |
          scripts/alert.sh "deploy sonarr failed on MacMini" \
            "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_number }}"
