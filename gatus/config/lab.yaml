# Group "lab" — every service the lab runs, asked ONCE, the way a browser
# asks: by public name, over TLS, through caddy. Each check exercises the
# whole chain — Netlify DNS resolving the wildcard, the lego-renewed
# certificate being valid, caddy routing by Host, the upstream answering.
#
# Intervals: 2m across the board. Tighter buys nothing — the alert waits
# for three failures anyway — and a slow check must never hold the others
# (Gatus evaluates 3 endpoints concurrently by default).

endpoints:
  - name: mini
    group: lab
    url: tcp://${LAB_HOST}:22
    interval: 2m
    conditions:
      - "[CONNECTED] == true"
    alerts:
      - type: pushover

  - name: forgejo
    group: lab
    url: https://code.twolfe.dev/api/healthz
    interval: 2m
    conditions:
      - "[STATUS] == 200"
      - "[BODY].status == pass"
      - "[CERTIFICATE_EXPIRATION] > 336h"
    alerts:
      - type: pushover

  - name: jellyfin
    group: lab
    url: https://jellyfin.twolfe.dev/health
    interval: 2m
    conditions:
      - "[STATUS] == 200"
      - "[BODY] == Healthy"
      - "[CERTIFICATE_EXPIRATION] > 336h"
    alerts:
      - type: pushover

  - name: mail watcher
    group: lab
    url: https://mail.twolfe.dev/health
    interval: 2m
    conditions:
      - "[STATUS] == 200"
      - "[BODY] == Healthy"
      - "[CERTIFICATE_EXPIRATION] > 336h"
    alerts:
      - type: pushover

  - name: proton bridge
    group: lab
    # Probed BY the watcher, because nothing else can reach it.
    url: https://mail.twolfe.dev/health/bridge
    interval: 2m
    conditions:
      - "[STATUS] == 200"
      - "[BODY] == Healthy"
      - "[CERTIFICATE_EXPIRATION] > 336h"
    alerts:
      - type: pushover

  - name: garage
    group: lab
    url: https://s3.twolfe.dev/
    interval: 2m
    conditions:
      - "[STATUS] == 403"
      - "[CERTIFICATE_EXPIRATION] > 336h"
    alerts:
      - type: pushover

  - name: beszel
    group: lab
    url: https://beszel.twolfe.dev/api/health
    interval: 2m
    conditions:
      - "[STATUS] == 200"
      - "[CERTIFICATE_EXPIRATION] > 336h"
    alerts:
      - type: pushover

  - name: qbittorrent
    group: lab
    url: https://qbittorrent.twolfe.dev/
    interval: 2m
    conditions:
      - "[STATUS] == 200"
      - "[CERTIFICATE_EXPIRATION] > 336h"
    alerts:
      - type: pushover

  - name: sonarr
    group: lab
    url: https://sonarr.twolfe.dev/ping
    interval: 2m
    conditions:
      - "[STATUS] == 200"
      - "[BODY].status == OK"
      - "[CERTIFICATE_EXPIRATION] > 336h"
    alerts:
      - type: pushover

  - name: radarr
    group: lab
    url: https://radarr.twolfe.dev/ping
    interval: 2m
    conditions:
      - "[STATUS] == 200"
      - "[BODY].status == OK"
      - "[CERTIFICATE_EXPIRATION] > 336h"
    alerts:
      - type: pushover

  - name: immich
    group: lab
    url: https://immich.twolfe.dev/api/server/ping
    interval: 2m
    conditions:
      - "[STATUS] == 200"
      - "[BODY].res == pong"
      - "[CERTIFICATE_EXPIRATION] > 336h"
    alerts:
      - type: pushover

  - name: ollama
    group: lab
    url: https://ai.twolfe.dev/api/tags
    interval: 2m
    conditions:
      - "[STATUS] == 200"
      - "len([BODY].models) > 0"
      - "[CERTIFICATE_EXPIRATION] > 336h"
    alerts:
      - type: pushover
