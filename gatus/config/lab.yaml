# Group "lab" — each service asked DIRECTLY over the `lab` Docker network,
# by container name. Answers the question "is the application up and
# answering", independent of DNS, the certificate and caddy; those are
# front-door.yaml's job. Together the two groups localise a fault: lab
# green + front door red = the edge; both red = the service.
#
# Container names resolve ONLY on this network, so this file is the one
# that changes when Gatus moves to the Pi (README.md "Moving to the Pi") —
# every url here becomes a macmini.local:<port> address from ENDPOINTS.md.
#
# Intervals: 2m across the board. Tighter buys nothing — the alert waits
# for three failures anyway — and a slow check must never hold the others
# (Gatus evaluates 3 endpoints concurrently by default).

endpoints:
  - name: forgejo
    group: lab
    url: http://forgejo:3000/api/healthz
    interval: 2m
    conditions:
      - "[STATUS] == 200"
      - "[BODY].status == pass"
    alerts:
      - type: pushover

  - name: forgejo ssh
    group: lab
    # sshd inside the forgejo container, the same listener the tailscale
    # sidecar proxies to git.twolfe.dev:22 — this one proves the daemon,
    # the tailnet check in dependencies.yaml proves the path to it.
    url: tcp://forgejo:22
    interval: 2m
    conditions:
      - "[CONNECTED] == true"
    alerts:
      - type: pushover

  - name: kestra
    group: lab
    # Micronaut's management port, the same one the container's own
    # healthcheck curls (kestra/compose.yaml). Unpublished to the host,
    # but a container on the lab network can reach it directly — which
    # makes this the ONE check of Kestra that doesn't need credentials.
    # VERIFY on first deploy: the management port must bind beyond
    # loopback for this to connect. If it stays red while Kestra is fine,
    # fall back to the UI root (http://kestra:8080/ui/) and note it here.
    url: http://kestra:8081/health
    interval: 2m
    conditions:
      - "[STATUS] == 200"
      - "[BODY].status == UP"
    alerts:
      - type: pushover

  - name: jellyfin
    group: lab
    url: http://jellyfin:8096/health
    interval: 2m
    conditions:
      - "[STATUS] == 200"
      - "[BODY] == Healthy"
    alerts:
      - type: pushover

  - name: garage
    group: lab
    # The admin API's unauthenticated liveness route — the S3 API on 3900
    # has no equivalent (a bare GET is 403 AccessDenied; see front-door.yaml
    # for why that is still useful through caddy).
    url: http://garage:3903/health
    interval: 2m
    conditions:
      - "[STATUS] == 200"
    alerts:
      - type: pushover

  - name: beszel
    group: lab
    # The same route `lab.beszel/health` polls from Kestra. Two watchers
    # for the monitoring hub is not redundancy for its own sake: this one
    # is on a 2-minute cadence with history, that one alerts even when
    # Gatus itself is down.
    url: http://beszel:8090/api/health
    interval: 2m
    conditions:
      - "[STATUS] == 200"
    alerts:
      - type: pushover

  - name: qbittorrent
    group: lab
    # GLUETUN, not qbittorrent: the client shares gluetun's network
    # namespace, so on the lab network its web UI answers at gluetun's
    # name (qbittorrent/caddy.caddyfile). The Host header is required —
    # qBittorrent validates it and answers 401 to any name not in its
    # "Server domains" list, of which this is one.
    url: http://gluetun:8080/
    interval: 2m
    headers:
      Host: qbittorrent.lab.twolfe.dev
    conditions:
      - "[STATUS] == 200"
    alerts:
      - type: pushover
