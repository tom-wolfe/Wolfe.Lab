name: mail-watcher

services:
  watcher:
    image: lab/mail-watcher
    container_name: mail-watcher
    restart: unless-stopped
    pull_policy: never

    environment:
      Watcher__BridgeHost: proton-bridge
      Watcher__Username: ${BRIDGE_USERNAME}
      Watcher__Password: ${BRIDGE_PASSWORD}
      Watcher__StatePath: /state/watermark.json
      Model__Endpoint: https://ai.twolfe.dev
      Model__Name: qwen3:30b-a3b
      Model__Fallback: qwen3:8b
      TZ: Europe/London
    healthcheck:
      test: ["CMD", "curl", "-sS", "--fail-with-body", "http://127.0.0.1:8080/health"]
      interval: 60s
      timeout: 10s
      retries: 3
      # The first IMAP session has to connect before there is anything healthy to report.
      start_period: 90s

    volumes:
      - /Users/tomwolfe/Docker/mail/watcher:/state

    networks:
      - lab

networks:
  lab:
    external: true
