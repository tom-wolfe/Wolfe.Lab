# yaml-language-server: $schema=../../../platform/lab/schema/lab.schema.json
name: mini
kind: model
workflow: ollama
description: "Ollama on the mini: the endpoint whenever the Studio sleeps."
runsOn: [mini]
agent: ollama
package:
  github: ollama/ollama
  version: 0.40.0
  asset: ollama-darwin.tgz
  checksums: sha256sum.txt
program: "{package}/ollama"
arguments: [serve]
environment:
  OLLAMA_HOST: 0.0.0.0:11434
  OLLAMA_MODELS: /Volumes/Data2/ollama/models
