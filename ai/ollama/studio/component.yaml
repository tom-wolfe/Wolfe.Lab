# yaml-language-server: $schema=../../../platform/lab/schema/lab.schema.json
name: studio
kind: model
workflow: agent
description: "Ollama on the Studio: the endpoint while it is awake."
runsOn: [studio]
agent: ollama
package:
  github: ollama/ollama
  version: 0.40.1
  asset: ollama-darwin.tgz
  checksums: sha256sum.txt
program: "{package}/ollama"
arguments: [serve]
environment:
  OLLAMA_HOST: 0.0.0.0:11434
  OLLAMA_MODELS: /Users/tomwolfe/.ollama/models
  OLLAMA_NUM_PARALLEL: "1"
