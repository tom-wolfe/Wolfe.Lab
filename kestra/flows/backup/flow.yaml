id: backup
namespace: lab.kestra
description: Nightly pg_dump of the kestra database.
labels:
  job: backup
  alert: high

concurrency:
  limit: 1
  behavior: QUEUE

tasks:
  - id: backup
    type: io.kestra.plugin.fs.ssh.Command
    # Slowest observed backup is ~20s (forgejo, 2026-08-29); this is ~45x
    # that. See ../../kestra/README.md "Timeouts" for why it's set this wide
    # and what a timeout does and doesn't abort.
    timeout: PT15M
    commands:
      - kestra/backup

triggers:
  - id: nightly
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "20 3 * * *"
    timezone: Europe/London
