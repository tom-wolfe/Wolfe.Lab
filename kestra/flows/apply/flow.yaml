id: apply
namespace: lab.kestra
description: Applies the Kestra Tofu stack on every push to main.

labels:
  job: apply
  alert: high

concurrency:
  limit: 1
  behavior: QUEUE

tasks:
  - id: apply
    type: io.kestra.plugin.fs.ssh.Command
    timeout: PT30M
    commands:
      - kestra/apply

triggers:
  - id: after-push
    type: io.kestra.plugin.core.trigger.Flow
    preconditions:
      id: main-moved
      flows:
        - namespace: lab.kestra
          flowId: push-to-main
          states: [SUCCESS]
