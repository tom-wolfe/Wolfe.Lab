id: alert-failed
namespace: system
description: Raises alerts on failed jobs in the lab namespace. 

tasks:
  - id: notify
    type: io.kestra.plugin.core.http.Request
    timeout: PT1M
    uri: https://api.pushover.net/1/messages.json
    method: POST
    contentType: application/x-www-form-urlencoded
    formData:
      token: "{{ secret('PUSHOVER_TOKEN') }}"
      user: "{{ secret('PUSHOVER_USER') }}"
      title: "{{ trigger.namespace }}/{{ trigger.flowId }} {{ trigger.state }}"
      message: |
        Failed task: {{ trigger.firstFailedTaskId | default('unknown') }}
        Execution: {{ trigger.executionId }}
      priority: "{{ trigger.state == 'FAILED' and (trigger.executionLabels.alert | default('low')) == 'high' ? '1' : '-1' }}"
      url: "https://kestra.lab.twolfe.dev/ui/main/executions/{{ trigger.namespace }}/{{ trigger.flowId }}/{{ trigger.executionId }}"
      url_title: Open execution

triggers:
  - id: any-lab-failure
    type: io.kestra.plugin.core.trigger.Flow
    preconditions:
      id: failed-under-lab
      where:
        - id: lab-namespace-failed
          filters:
            - field: NAMESPACE
              type: STARTS_WITH
              value: "lab."
            - field: STATE
              type: IN
              values:
                - FAILED
                - WARNING
