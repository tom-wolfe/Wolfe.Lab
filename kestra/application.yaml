# Kestra server configuration — mounted read-only into the container via
# MICRONAUT_CONFIG_FILES. Everything secret is a ${...} placeholder resolved
# from the env_file at startup; a missing variable fails the boot loudly
# rather than starting an unconfigured server.

datasources:
  postgres:
    url: jdbc:postgresql://postgres:5432/kestra
    driver-class-name: org.postgresql.Driver
    username: kestra
    password: ${KESTRA_DB_PASSWORD}

kestra:
  server:
    basic-auth:
      enabled: true
      # Kestra requires an email-shaped username.
      username: trwolfe13@gmail.com
      password: ${KESTRA_BASIC_AUTH_PASSWORD}
      # The webhook endpoint skips basic auth so CI can poke flows; each
      # webhook's own key (in the flow YAML) is the auth on that path.
      open-urls:
        - "/api/v1/main/executions/webhook/"

  repository:
    type: postgres
  queue:
    type: postgres

  storage:
    type: local
    local:
      base-path: /app/storage

  # Encrypts SECRET-type inputs/outputs at rest in Postgres.
  encryption:
    secret-key: ${KESTRA_ENCRYPTION_KEY}

  # Don't seed the demo namespace.
  tutorial-flows:
    enabled: false

  plugins:
    configurations:
      # Docker task runners may mount volumes (off by default upstream).
      # Every mount they're given is listed in the defaults below.
      - type: io.kestra.plugin.scripts.runner.docker.Docker
        values:
          volume-enabled: true

    defaults:
      # The job bridge's connection details, in ONE place instead of five
      # lines in every flow. `forced` cuts both ways deliberately: flows
      # can't drift from these values, and a flow can't point the SSH task
      # at a different host or key — the bridge is the only place this
      # task type can go.
      - type: io.kestra.plugin.fs.ssh.Command
        forced: true
        values:
          host: host.docker.internal
          port: "22"
          username: tomwolfe
          authMethod: PUBLIC_KEY
          privateKey: "{{ secret('LAB_SSH_KEY') }}"

      # Container jobs (the deploy flows): a docker CLI image talking to
      # the host daemon through the socket. The repo checkout is mounted
      # AT ITS HOST PATH on purpose — `docker compose` in the task
      # container creates SIBLING containers on the host daemon, so every
      # bind source a compose file resolves must be a path the daemon can
      # see. /Volumes is mounted read-only for the deploy guard: an
      # unmounted drive is a shadow directory, visible as such from here
      # (see scripts/deploy.sh).
      # Not forced: a flow that needs a different image or an extra mount
      # states its own values and keeps these.
      - type: io.kestra.plugin.scripts.shell.Commands
        values:
          containerImage: docker:28-cli
          taskRunner:
            type: io.kestra.plugin.scripts.runner.docker.Docker
            volumes:
              - /var/run/docker.sock:/var/run/docker.sock
              - /Users/tomwolfe/.local/share/chezmoi:/Users/tomwolfe/.local/share/chezmoi:ro
              - /Volumes:/Volumes:ro
