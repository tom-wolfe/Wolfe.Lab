name: caddy

services:
  caddy:
    image: caddy:2.10
    container_name: caddy
    restart: unless-stopped

    environment:
      # Host /etc/localtime is a symlink into /var/db/timezone — dangles
      # inside a Linux container. Set TZ instead (jellyfin pattern).
      TZ: Europe/London

    volumes:
      # Config is code — lives in this repo, mounted read-only.
      - ./Caddyfile:/etc/caddy/Caddyfile:ro

      # The whole repo checkout, read-only: the Caddyfile's import glob
      # pulls each slice's caddy.caddyfile from here. Safe to mount — the
      # repo deliberately contains no secret material, only op:// refs.
      - ..:/etc/caddy/lab:ro

      # The wildcard certificate, written by the renew-certs job (lego
      # state lives in ~/Docker/caddy/lego — that's the ACME account and
      # key material: state, backed up like all state). Caddy cannot
      # START without these files — setup.sh runs the job first.
      - /Users/tomwolfe/Docker/caddy/lego/certificates:/certs:ro

      # Caddy runtime state. Modest now that ACME moved out; kept because
      # state is data and lives outside the repo, like every other stack.
      - /Users/tomwolfe/Docker/caddy/data:/data
      - /Users/tomwolfe/Docker/caddy/config:/config

    ports:
      - "80:80" # HTTP -> HTTPS redirect (Caddy automatic)
      - "443:443"
      - "443:443/udp" # HTTP/3

    networks:
      - lab

    healthcheck:
      # Caddy's admin API, on by default at localhost:2019 inside the
      # container. The image is Alpine, so busybox wget is present.
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:2019/config/"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

networks:
  # THIS slice owns the shared edge network; every proxied slice joins it
  # with `external: true`. Consequence: caddy must be deployed once before
  # any slice that references the network — see README.md deploy order.
  lab:
    name: lab
