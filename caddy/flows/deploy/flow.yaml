id: deploy
namespace: lab.caddy
description: |
  Deploys the Caddy compose stack on a green Chezmoi tick,
  then reloads routes via the post.sh hook beside this file.

labels:
  job: deploy
  alert: low

concurrency:
  limit: 1
  behavior: QUEUE

tasks:
  - id: converge
    type: io.kestra.plugin.scripts.shell.Commands
    timeout: PT20M
    commands:
      - /Users/tomwolfe/.local/share/chezmoi/scripts/deploy.sh caddy

triggers:
  # See forgejo/flows/deploy/flow.yaml for the design notes.
  - id: after-tick
    type: io.kestra.plugin.core.trigger.Flow
    preconditions:
      id: chezmoi-tick-green
      flows:
        - namespace: lab.chezmoi
          flowId: update
          states: [SUCCESS]
