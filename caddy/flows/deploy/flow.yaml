id: deploy
namespace: lab.caddy
description: |
  Converge the caddy compose stack from the repo checkout. Chains on
  every green tick (the tick is what pulls the repo); between
  changes each run is a no-op thanks to compose's config-hash convergence.
  Route snippets need no container restart on their own — but a reload does
  no harm and `up -d` won't notice a snippet-only change, so the script
  reloads explicitly. Host side: caddy/flows/deploy/script.sh via the
  lab-job bridge.

labels:
  job: deploy
  # Low: a failed converge self-heals on the next green tick, and the tick
  # fans out six of these an hour — see system/alert-failed.
  alert: low

concurrency:
  limit: 1
  behavior: QUEUE

tasks:
  - id: converge
    type: io.kestra.plugin.fs.ssh.Command
    timeout: PT20M
    host: host.docker.internal
    port: "22"
    username: tomwolfe
    authMethod: PUBLIC_KEY
    privateKey: "{{ secret('LAB_SSH_KEY') }}"
    commands:
      - caddy/deploy

triggers:
  # See forgejo/flows/deploy/flow.yaml for the design notes.
  - id: after-tick
    type: io.kestra.plugin.core.trigger.Flow
    preconditions:
      id: chezmoi-tick-green
      flows:
        - namespace: lab.chezmoi
          flowId: update
          states: [SUCCESS]
