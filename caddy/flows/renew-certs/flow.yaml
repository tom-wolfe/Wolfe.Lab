id: renew-certs
namespace: lab.caddy
description: |
  Nightly issue-or-renew of the *.lab.twolfe.dev wildcard certificate via
  lego (DNS-01 against Netlify), reloading caddy when it changes. lego's
  ARI-driven `run` makes this a no-op most nights — but running daily means
  a broken renewal chain shows up as a red run WEEKS before the cert
  actually expires. 03:50: clear of the tick's quarter-hour columns,
  after the backups (02:50–03:35), before the janitor (04:00). Host side:
  caddy/flows/renew-certs/script.sh via the lab-job bridge.

labels:
  job: cert
  # High: nothing else notices a broken renewal chain, and the failure is
  # weeks ahead of the symptom — exactly the alert worth being woken for.
  alert: high

concurrency:
  limit: 1
  behavior: QUEUE

tasks:
  - id: renew
    type: io.kestra.plugin.fs.ssh.Command
    timeout: PT15M
    commands:
      - caddy/renew-certs

triggers:
  - id: nightly
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "50 3 * * *"
    timezone: Europe/London
