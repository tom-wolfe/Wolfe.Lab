id: plan
namespace: lab.caddy
description: Plans the Caddy Tofu stack on every green tick, reporting drift.

labels:
  job: plan
  alert: low

concurrency:
  limit: 1
  behavior: QUEUE

tasks:
  - id: plan
    type: io.kestra.plugin.fs.ssh.Command
    # Drift and a genuine plan error both land as WARNING.
    allowFailure: true
    timeout: PT10M
    commands:
      - caddy/plan

triggers:
  - id: after-tick
    type: io.kestra.plugin.core.trigger.Flow
    preconditions:
      id: chezmoi-tick-green
      flows:
        - namespace: lab.chezmoi
          flowId: update
          states: [SUCCESS]
