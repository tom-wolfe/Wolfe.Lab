id: chezmoi-update
namespace: lab
description: |
  Converge the Mac mini: pull Wolfe.Lab and run chezmoi apply, which also
  redeploys any compose stack whose file changed (the deploy hook hashes
  compose/*/compose.yaml). The host side is the `chezmoi-update` case in
  ~/.local/bin/lab-job, reached through the forced-command SSH bridge.

# A poke landing mid-run queues instead of overlapping.
concurrency:
  limit: 1
  behavior: QUEUE

tasks:
  - id: converge
    type: io.kestra.plugin.fs.ssh.Command
    host: host.docker.internal
    port: "22"
    username: tomwolfe
    authMethod: PUBLIC_KEY
    privateKey: "{{ secret('LAB_SSH_KEY') }}"
    commands:
      - chezmoi-update

triggers:
  # Steady-state convergence: the mini never drifts more than an hour
  # behind main, even if nothing pokes it.
  - id: hourly
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 * * * *"
    timezone: Europe/London

  # The poke: post-merge CI calls
  #   POST http://macmini.local:8180/api/v1/main/executions/webhook/lab/chezmoi-update/<key>
  # for a deploy within seconds of a merge instead of within the hour.
  # The key is the only auth on this path (it's basic-auth-exempt); it can
  # start this flow and nothing else. LAN-only, like everything here.
  - id: poke
    type: io.kestra.plugin.core.trigger.Webhook
    key: 94544df19d6b7541659285d276b89094cea04710ff40b213
