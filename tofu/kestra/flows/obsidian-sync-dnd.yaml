id: obsidian-sync-dnd
namespace: lab
description: |
  One-shot sync of the Dungeons & Dragons Obsidian vault from Google Drive.
  See obsidian-sync-main for the design; this is its twin, offset by five
  minutes so the two passes never contend for Drive at the same moment.

concurrency:
  limit: 1
  behavior: QUEUE

tasks:
  - id: sync
    type: io.kestra.plugin.fs.ssh.Command
    host: host.docker.internal
    port: "22"
    username: tomwolfe
    authMethod: PUBLIC_KEY
    privateKey: "{{ secret('LAB_SSH_KEY') }}"
    commands:
      - obsidian-sync-dnd

triggers:
  - id: every-10-min-offset
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "5-59/10 * * * *"
    timezone: Europe/London
