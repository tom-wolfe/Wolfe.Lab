# shellcheck shell=bash disable=SC2034
state="$HOME/Docker/sonarr/config"
paths=("$state")

# What's kept is what can't be re-derived: sonarr.db (series, root
# folders, naming settings) and config.xml (API key, auth).
excludes=(
  # Sonarr's own scheduled zip backups — restic IS the backup.
  --exclude "$state/Backups"
  # Artwork, re-fetched from TVDB on demand.
  --exclude "$state/MediaCover"
  --exclude "$state/logs"
  --exclude "$state/logs.db"
  --exclude "$state/logs.db-*"
)
