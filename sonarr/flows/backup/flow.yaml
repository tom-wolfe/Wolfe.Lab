id: backup
namespace: lab.sonarr
description: Nightly cold backup of sonarr's state.
labels:
  job: backup
  alert: high

concurrency:
  limit: 1
  behavior: QUEUE

tasks:
  - id: backup
    type: io.kestra.plugin.fs.ssh.Command
    timeout: PT15M
    commands:
      - sonarr/backup

triggers:
  - id: nightly
    cron: "5 4 * * *"
    timezone: Europe/London
