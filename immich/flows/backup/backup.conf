# shellcheck shell=bash disable=SC2034
library=/Volumes/Data2/immich
container=immich-server
paths=("$library")

# Warm: no stop. Originals are write-once, and the database is Immich's
# own nightly dump in backups/ (02:00, before this runs), which is its
# documented restore path — the postgres directory is not what comes back.
stop=false

# Regenerated by Immich's jobs from the originals — the same call as
# jellyfin's artwork.
excludes=(
  --exclude "$library/thumbs"
  --exclude "$library/encoded-video"
)
