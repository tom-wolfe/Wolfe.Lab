id: plan
namespace: lab.forgejo
description: Plans the Forgejo Tofu stack on every green tick, reporting drift.

labels:
  job: plan
  alert: low

concurrency:
  limit: 1
  behavior: QUEUE

tasks:
  - id: plan
    type: io.kestra.plugin.fs.ssh.Command
    # Drift and a genuine plan error both land as WARNING; the message in
    # the logs tells them apart. Connection comes from the forced ssh
    # defaults in kestra/application.yaml.
    allowFailure: true
    timeout: PT10M
    commands:
      - forgejo/plan

triggers:
  # See forgejo/flows/deploy/flow.yaml for the design notes.
  - id: after-tick
    type: io.kestra.plugin.core.trigger.Flow
    preconditions:
      id: chezmoi-tick-green
      flows:
        - namespace: lab.chezmoi
          flowId: update
          states: [SUCCESS]
