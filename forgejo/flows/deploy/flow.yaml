id: deploy
namespace: lab.forgejo
description: Deploys the Forgejo compose stack on a green Chezmoi tick.

labels:
  job: deploy
  alert: low

concurrency:
  limit: 1
  behavior: QUEUE

tasks:
  - id: converge
    type: io.kestra.plugin.scripts.shell.Commands
    timeout: PT20M
    commands:
      - /Users/tomwolfe/.local/share/chezmoi/scripts/deploy.sh forgejo

triggers:
  # Fires after each SUCCESSful tick execution: pull -> config -> deploys,
  # always in that order — and a broken config converge pauses deployment
  # entirely (the next green tick catches everything up).
  # NOTE the namespace/flowId here are the tick's IDENTITY, and an exact
  # match: a Flow trigger that matches nothing does not error, it silently
  # never fires. If the tick is ever renamed, every deploy flow moves with
  # it in the same commit, and you verify by watching one tick fan out.
  - id: after-tick
    type: io.kestra.plugin.core.trigger.Flow
    preconditions:
      id: chezmoi-tick-green
      flows:
        - namespace: lab.chezmoi
          flowId: update
          states: [SUCCESS]
