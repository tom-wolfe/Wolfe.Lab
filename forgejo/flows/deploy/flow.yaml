id: deploy-forgejo
namespace: lab
description: |
  Converge the forgejo compose stack from the repo checkout. Chains on every
  green chezmoi-update tick (the tick is what pulls the repo), so a merged
  compose change lands within one tick; between changes each run is a no-op
  thanks to compose's own config-hash convergence. Host side:
  forgejo/flows/deploy/script.sh via the lab-job bridge.

# A slow converge (image pull, migration) must finish before the next
# tick's attempt starts.
concurrency:
  limit: 1
  behavior: QUEUE

tasks:
  - id: converge
    type: io.kestra.plugin.fs.ssh.Command
    host: host.docker.internal
    port: "22"
    username: tomwolfe
    authMethod: PUBLIC_KEY
    privateKey: "{{ secret('LAB_SSH_KEY') }}"
    commands:
      - forgejo/deploy

triggers:
  # Fires after each SUCCESSful chezmoi-update execution: pull -> config ->
  # deploys, always in that order — and a broken config converge pauses
  # deployment entirely (the next green tick catches everything up).
  # tofu apply validates flow YAML server-side; if this precondition syntax
  # drifts in a future Kestra, the apply will say so.
  - id: after-tick
    type: io.kestra.plugin.core.trigger.Flow
    preconditions:
      id: chezmoi-tick-green
      flows:
        - namespace: lab
          flowId: chezmoi-update
          states: [SUCCESS]
