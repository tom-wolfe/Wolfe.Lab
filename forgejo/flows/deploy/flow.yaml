id: deploy
namespace: lab.forgejo
description: |
  Converge the forgejo compose stack from the repo checkout. Chains on every
  green tick (the tick is what pulls the repo), so a merged compose change
  lands within one tick; between changes each run is a no-op thanks to
  compose's own config-hash convergence. Host side:
  forgejo/flows/deploy/script.sh via the lab-job bridge.

labels:
  job: deploy
  alert: low

# A slow converge (image pull, migration) must finish before the next
# tick's attempt starts.
concurrency:
  limit: 1
  behavior: QUEUE

tasks:
  - id: converge
    type: io.kestra.plugin.fs.ssh.Command
    timeout: PT20M
    host: host.docker.internal
    port: "22"
    username: tomwolfe
    authMethod: PUBLIC_KEY
    privateKey: "{{ secret('LAB_SSH_KEY') }}"
    commands:
      - forgejo/deploy

triggers:
  # Fires after each SUCCESSful tick execution: pull -> config -> deploys,
  # always in that order — and a broken config converge pauses deployment
  # entirely (the next green tick catches everything up).
  # NOTE the namespace/flowId here are the tick's IDENTITY, and an exact
  # match: a Flow trigger that matches nothing does not error, it silently
  # never fires. If the tick is ever renamed, every deploy flow moves with
  # it in the same commit, and you verify by watching one tick fan out.
  - id: after-tick
    type: io.kestra.plugin.core.trigger.Flow
    preconditions:
      id: chezmoi-tick-green
      flows:
        - namespace: lab.chezmoi
          flowId: update
          states: [SUCCESS]
