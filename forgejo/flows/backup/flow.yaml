id: backup
namespace: lab.forgejo
description: Nightly cold backup of forgejo's data directory.

labels:
  job: backup
  alert: high

concurrency:
  limit: 1
  behavior: QUEUE

tasks:
  - id: backup
    type: io.kestra.plugin.fs.ssh.Command
    timeout: PT15M
    commands:
      - forgejo/backup

triggers:
  - id: nightly
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "5 3 * * *"
    timezone: Europe/London
