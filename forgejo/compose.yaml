name: forgejo

services:
  server:
    image: codeberg.org/forgejo/forgejo:16.0.2
    container_name: forgejo
    restart: unless-stopped
    environment:
      FORGEJO____APP_NAME: "Wolfe.Lab"
      FORGEJO____APP_SLOGAN: I write code and stuff.
      FORGEJO__cron__ENABLED: "true"
      FORGEJO__database__DB_TYPE: sqlite3
      FORGEJO__database__PATH: /data/gitea/forgejo.db
      FORGEJO__indexer__REPO_INDEXER_ENABLED: "true"
      FORGEJO__pull-request__DEFAULT_MERGE_STYLE: "squash"
      FORGEJO__repository__ENABLE_PUSH_CREATE_ORG: "true"
      FORGEJO__repository__ENABLE_PUSH_CREATE_USER: "true"
      FORGEJO__server__DOMAIN: code.twolfe.dev
      FORGEJO__server__HTTP_PORT: 3000
      FORGEJO__server__ROOT_URL: https://code.twolfe.dev/
      FORGEJO__server__SSH_DOMAIN: git.twolfe.dev
      FORGEJO__server__SSH_PORT: "22"
      FORGEJO__service__DISABLE_REGISTRATION: "true"
      FORGEJO__service__ENABLE_NOTIFY_MAIL: "false"
      FORGEJO__service__REQUIRE_SIGNIN_VIEW: "false"
      # Webhooks may only target EXTERNAL addresses by default (SSRF
      # guard), and the poke targets kestra on the lab network.
      FORGEJO__webhook__ALLOWED_HOST_LIST: kestra
      TZ: Europe/London
      USER_UID: 1000
      USER_GID: 1000
    volumes:
      - /Users/tomwolfe/Docker/forgejo/data:/data
    ports:
      - "3000:3000"
    networks:
      - lab
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/api/healthz"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s

  tailscale:
    image: tailscale/tailscale:v1.102.3
    container_name: forgejo-tailscale
    restart: unless-stopped
    network_mode: service:server
    depends_on:
      server:
        condition: service_healthy
        restart: true
    environment:
      TS_HOSTNAME: forgejo
      TS_STATE_DIR: /var/lib/tailscale
      TS_USERSPACE: "true"
      TS_AUTH_ONCE: "true"
    env_file:
      - /Users/tomwolfe/Docker/forgejo/tailscale.env
    volumes:
      - /Users/tomwolfe/Docker/forgejo/tailscale:/var/lib/tailscale

networks:
  lab:
    external: true
